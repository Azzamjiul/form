basePath: /api
definitions:
  models.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/models.ErrorData'
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  models.AutoSaveAnswerRequest:
    properties:
      answer_value:
        type: object
      field_id:
        type: string
    required:
    - answer_value
    - field_id
    type: object
  models.BatchCreateWhitelistRequest:
    properties:
      entries:
        items:
          $ref: '#/definitions/models.CreateWhitelistRequest'
        minItems: 1
        type: array
    required:
    - entries
    type: object
  models.CreateFieldRequest:
    properties:
      answer_key:
        type: object
      content_type:
        enum:
        - input_field
        - section
        - display_text
        type: string
      description:
        type: string
      field_type:
        type: string
      is_required:
        type: boolean
      label:
        type: string
      options:
        type: object
      order_global:
        type: integer
      order_in_section:
        type: integer
      points:
        type: integer
      section_id:
        type: string
    required:
    - content_type
    - label
    - order_global
    type: object
  models.CreateFormRequest:
    properties:
      description:
        type: string
      form_type:
        enum:
        - survey
        - quiz
        type: string
      passing_score:
        type: integer
      show_correct_answers:
        type: boolean
      shuffle_questions:
        type: boolean
      time_limit_minutes:
        type: integer
      title:
        type: string
    required:
    - form_type
    - title
    type: object
  models.CreateSectionRequest:
    properties:
      description:
        type: string
      order_global:
        type: integer
      prerequisite_section_id:
        type: string
      title:
        type: string
      visibility_type:
        enum:
        - always
        - after_section
        type: string
    required:
    - order_global
    - title
    - visibility_type
    type: object
  models.CreateWhitelistRequest:
    properties:
      email:
        type: string
      expires_at:
        description: RFC3339 format
        type: string
      external_user_id:
        type: string
      max_attempts:
        minimum: 1
        type: integer
      metadata:
        type: object
      name:
        type: string
    required:
    - email
    - expires_at
    - external_user_id
    - max_attempts
    - name
    type: object
  models.DuplicateFormRequest:
    properties:
      new_title:
        type: string
    required:
    - new_title
    type: object
  models.ErrorData:
    properties:
      code:
        type: string
      details:
        additionalProperties: true
        type: object
      message:
        type: string
    type: object
  models.ExportResponse:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      download_url:
        type: string
      file_size:
        type: integer
      job_id:
        type: string
      record_count:
        type: integer
      status:
        description: '"pending", "processing", "completed", "failed"'
        type: string
    type: object
  models.FlagRequest:
    properties:
      is_flagged:
        type: boolean
      notes:
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  models.ReorderFieldItem:
    properties:
      field_id:
        type: string
      order_global:
        type: integer
      order_in_section:
        type: integer
      section_id:
        type: string
    required:
    - field_id
    - order_global
    type: object
  models.ReorderFieldsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/models.ReorderFieldItem'
        minItems: 1
        type: array
    required:
    - items
    type: object
  models.ResumeQuizRequest:
    properties:
      session_token:
        type: string
    required:
    - session_token
    type: object
  models.StartQuizRequest:
    properties:
      access_token:
        type: string
    required:
    - access_token
    type: object
  models.SubmitAnswerItem:
    properties:
      answer_value:
        type: object
      field_id:
        type: string
    required:
    - answer_value
    - field_id
    type: object
  models.SubmitQuizRequest:
    properties:
      answers:
        items:
          $ref: '#/definitions/models.SubmitAnswerItem'
        type: array
    required:
    - answers
    type: object
  models.UpdateFieldRequest:
    properties:
      answer_key:
        type: object
      description:
        type: string
      field_type:
        type: string
      is_required:
        type: boolean
      label:
        type: string
      options:
        type: object
      order_global:
        type: integer
      order_in_section:
        type: integer
      points:
        type: integer
      section_id:
        type: string
    type: object
  models.UpdateFormRequest:
    properties:
      description:
        type: string
      passing_score:
        type: integer
      show_correct_answers:
        type: boolean
      shuffle_questions:
        type: boolean
      time_limit_minutes:
        type: integer
      title:
        type: string
    type: object
  models.UpdateSectionRequest:
    properties:
      description:
        type: string
      order_global:
        type: integer
      prerequisite_section_id:
        type: string
      title:
        type: string
      visibility_type:
        enum:
        - always
        - after_section
        type: string
    type: object
  models.UpdateWhitelistRequest:
    properties:
      expires_at:
        description: RFC3339 format
        type: string
      max_attempts:
        minimum: 1
        type: integer
      metadata:
        type: object
    type: object
host: localhost:8080
info:
  contact:
    email: support@form.com
    name: API Support
  description: API for form application with JWT authentication
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: form API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access and refresh tokens
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate tokens (client-side mainly)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get the current authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get new access and refresh tokens using a valid refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, password, and name
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Register a new user
      tags:
      - auth
  /exports/{job_id}/download:
    get:
      consumes:
      - application/json
      description: Download the exported file when the job is completed
      parameters:
      - description: Export job ID
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Download exported file
      tags:
      - export
  /exports/{job_id}/status:
    get:
      consumes:
      - application/json
      description: Check the status of an export job and get download URL when ready
      parameters:
      - description: Export job ID
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ExportResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get export job status
      tags:
      - export
  /forms:
    get:
      consumes:
      - application/json
      description: Get all forms created by current user (paginated)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      - default: modified
        description: Sort by (created or modified)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc or desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all user forms
      tags:
      - forms
    post:
      consumes:
      - application/json
      description: Create a new form (survey or quiz)
      parameters:
      - description: Create form request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateFormRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a new form
      tags:
      - forms
  /forms/{form_id}:
    delete:
      consumes:
      - application/json
      description: Delete form (soft delete)
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete form
      tags:
      - forms
    get:
      consumes:
      - application/json
      description: Get form details with all sections and fields
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get form details
      tags:
      - forms
    put:
      consumes:
      - application/json
      description: Update form settings (partial update)
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      - description: Update form request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateFormRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Update form settings
      tags:
      - forms
  /forms/{form_id}/analytics:
    get:
      consumes:
      - application/json
      description: Retrieve detailed analytics including summary statistics, score
        distribution, time analytics, and question performance
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      - description: Start date for analytics period (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: End date for analytics period (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Group responses by time period
        enum:
        - day
        - week
        - month
        in: query
        name: group_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get comprehensive analytics for a form
      tags:
      - analytics
  /forms/{form_id}/analytics/questions:
    get:
      consumes:
      - application/json
      description: Retrieve detailed analytics for each question including answer
        distribution and performance metrics
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get question-level analytics for a form
      tags:
      - analytics
  /forms/{form_id}/analytics/sections:
    get:
      consumes:
      - application/json
      description: Retrieve analytics for each section including average scores and
        completion rates
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get section-level analytics for a form
      tags:
      - analytics
  /forms/{form_id}/analytics/trends:
    get:
      consumes:
      - application/json
      description: Retrieve trend data showing responses over time with grouping options
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      - description: Group responses by time period
        enum:
        - day
        - week
        - month
        in: query
        name: group_by
        required: true
        type: string
      - description: Start date for trend analysis (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: End date for trend analysis (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get response trends over time for a form
      tags:
      - analytics
  /forms/{form_id}/duplicate:
    post:
      consumes:
      - application/json
      description: Create a copy of form with all settings and questions
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      - description: Duplicate form request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DuplicateFormRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Duplicate form
      tags:
      - forms
  /forms/{form_id}/export:
    get:
      consumes:
      - application/json
      description: Export form responses as CSV, Excel, or JSON with customizable
        columns and data inclusion
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      - description: Export format
        enum:
        - csv
        - excel
        - json
        in: query
        name: format
        required: true
        type: string
      - collectionFormat: csv
        description: Specific columns to include
        in: query
        items:
          type: string
        name: columns
        type: array
      - description: Start date filter (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: End date filter (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - default: true
        description: Include detailed answers
        in: query
        name: include_answers
        type: boolean
      - default: false
        description: Include analytics summary
        in: query
        name: include_analytics
        type: boolean
      - description: Filter by pass/fail status
        in: query
        name: is_passed
        type: boolean
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Export form responses in various formats
      tags:
      - export
  /forms/{form_id}/fields:
    get:
      consumes:
      - application/json
      description: Get all fields in form (ordered by order_global)
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
